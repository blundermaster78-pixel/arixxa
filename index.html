<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ARIXA · Event Resource Command Center</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='15' fill='%235e4380'/%3E%3Cpath d='M14 35L24 12L34 35M18.5 28H29.5' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
 --serif:'Instrument Serif',Georgia,'Times New Roman',serif;--gold:#f5b94a;
 --bg:#f6f1ea;--p:#ffffff;--p2:#faf6f0;--b:#e8dfd3;--bs:#ddd2c5;
 --g:#5e4380;--g2:#8466a8;--gl:#efe8f4;
 --t:#2b2430;--m:#7b7080;
 --clay:#c9775a;--clayl:#f6e8e0;--ochre:#c98a1b;--ochl:#fbf3df;--teal:#22b8dc;--teall:#dff6fc;
 --red:#b4473f;--redl:#f8e6e3;--grn:#5b8a5e;--grnl:#e9f2e6;
 --side:#2a1f3d;--side2:#171024;--neon:#e6d3a3;
 color-scheme:light;
}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--t);font:14.5px/1.55 'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}
h1,h2,h3,h4,p{margin:0}
.app{display:flex;height:100%}

/* sidebar */
aside{width:220px;background:linear-gradient(180deg,var(--side) 0%,var(--side2) 100%);box-shadow:4px 0 24px -12px rgba(8,43,51,.5);display:flex;flex-direction:column;flex-shrink:0;color:#ddd5ea}
.logo{height:72px;display:flex;align-items:center;padding:0 24px}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:var(--serif);font-weight:700;font-size:24px;letter-spacing:4px;color:#fff}
.wm small{font-size:10px;letter-spacing:2px;color:var(--neon);font-weight:600;margin-top:6px;text-transform:uppercase}
nav{padding:8px 12px;display:flex;flex-direction:column;gap:2px}
nav a{display:flex;align-items:center;padding:10px 12px;border-radius:8px;color:#ddd5ea;font-weight:500;text-decoration:none;cursor:pointer;transition:background .15s,color .15s}
nav a:hover{background:rgba(255,255,255,.06);color:#fff}
nav a.on{background:rgba(245,185,74,.16);color:#fff;font-weight:600;box-shadow:inset 3px 0 0 var(--gold)}
nav .n{margin-left:auto;background:var(--clay);color:#fff;border-radius:99px;font-size:11.5px;padding:1px 8px;font-weight:700}
.side-foot{margin-top:auto;padding:16px 24px}
.sfr{font-size:12px;font-weight:500;color:#cbbfe0;padding:0;text-decoration:underline;text-underline-offset:3px}
.sfr:hover{color:#fff}

/* top bar + page */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.top{height:72px;display:flex;align-items:center;gap:16px;padding:0 32px;border-bottom:1px solid var(--b);background:var(--p)}
.top h1{font-size:20px;font-weight:700}.top small{color:var(--m);display:block;font-size:13px}
.top .sp{margin-left:auto}
.page{flex:1;overflow-y:auto;padding:32px}

/* buttons, cards */
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:600;border:1px solid var(--bs);background:var(--p);transition:background .15s,border-color .15s}
.btn:hover{background:var(--p2);border-color:#b9aecb}
.btn.gold{background:var(--g);color:#fff;border-color:var(--g)}
.btn.gold:hover{background:#4a336a;border-color:#4a336a}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--p);border:1px solid var(--b);border-radius:12px;padding:24px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-bottom:28px}
.stat{cursor:pointer;display:block}
.stat:hover{border-color:var(--bs)}
.stat small{color:var(--m);font-size:13px;display:block}
.stat small:first-child{margin-bottom:6px}
.stat b{font-size:32px;font-weight:700;display:block;line-height:1.15;margin-bottom:4px}
.two{display:grid;grid-template-columns:2fr 1fr;gap:28px;margin-bottom:28px}
@media(max-width:1100px){.two{grid-template-columns:1fr}}
@media(max-width:800px){.app{flex-direction:column}aside{width:100%;flex-direction:row;align-items:center;overflow-x:auto}.logo{height:56px;padding:0 16px}.wm small,.side-foot{display:none}nav{flex-direction:row;padding:8px}nav a{white-space:nowrap}.page{padding:16px}.top{padding:0 16px}}
h2{font-size:16px;font-weight:700}.mu{color:var(--m);font-size:13px}

/* heatmap */
.heat{display:grid;grid-template-columns:140px repeat(14,minmax(0,1fr));gap:6px;min-width:760px;margin-top:20px}
.hd{text-align:center;font-size:11px;color:var(--m);line-height:1.3;font-weight:500}.hd b{display:block;font-size:14px;color:var(--t)}.hd.td,.hd.td b{color:var(--clay)}
.cell{height:36px;border-radius:6px;border:1px solid transparent}
.cell:hover{outline:2px solid var(--t);outline-offset:1px}
.f0{background:#f3f0f7;border-color:#e8e2ef}.f1{background:#e6dcef}.f2{background:#c6b4dc}.f3{background:#8466a8}.f4{background:#5e4380}
.cell.cf{border:2px solid var(--red)}
.rl{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px}

/* tags, badges, list items */
.tag{display:inline-flex;gap:5px;align-items:center;border:1px solid var(--b);background:var(--p2);border-radius:6px;padding:2px 9px;font-size:12.5px;font-weight:500;color:var(--t);margin:0 4px 4px 0}
.tag.bad{border-color:#e8bdb7;background:var(--redl);color:var(--red)}.tag.ok{border-color:#bcd9b8;background:var(--grnl);color:#3f6a45}
.bd{display:inline-block;border-radius:99px;padding:2px 11px;font-size:12px;font-weight:600;border:1px solid}
.bd.c,.bd.resolved{color:#3f6a45;background:var(--grnl);border-color:#bcd9b8}
.bd.p{color:#7a5a12;background:var(--ochl);border-color:#f0d9a0}
.bd.x,.bd.open{color:var(--red);background:var(--redl);border-color:#e8bdb7}
.item{border:1px solid var(--b);background:var(--p2);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.item b{display:block}.item small{color:var(--m)}
.li{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:center;padding:16px 0;border-bottom:1px solid var(--b)}
.li:last-child{border-bottom:0}

/* tables */
table{width:100%;border-collapse:collapse;min-width:980px}
th{text-align:left;color:var(--m);font-size:12px;font-weight:600;padding:12px 16px;border-bottom:1px solid var(--b);text-transform:uppercase;letter-spacing:.5px}
td{padding:16px;border-bottom:1px solid var(--b);vertical-align:middle}
tr:hover td{background:var(--p2)}

/* form controls */
input,select{width:100%;background:#fff;border:1px solid var(--bs);border-radius:8px;padding:9px 12px;color:var(--t);font:inherit;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(94,67,128,.14)}
.bar{height:8px;border-radius:99px;background:#ece7f1;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--g);border-radius:99px}
.bar.r i{background:var(--clay)}.bar.o i{background:var(--ochre)}.bar.t i{background:var(--teal)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{min-height:130px;border:1px solid var(--b);border-radius:10px;padding:10px;background:var(--p2)}
.day h4{font-size:13px;margin-bottom:8px;display:flex;justify-content:space-between}.day h4.td{color:var(--clay)}
.chip{font-size:11.5px;font-weight:600;border-radius:5px;padding:4px 7px;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid #bcd9b8;background:var(--grnl);color:#3f6a45}
.chip.p{border-style:dashed;border-color:#e8c46c;background:var(--ochl);color:#7a5a12}.chip.x{border-color:#e8bdb7;background:var(--redl);color:var(--red)}

/* resources */
.cg{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:24px}
.spec{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin-top:16px;font-size:13px}
.spec div{padding:2px 0}.spec small{display:block;color:var(--m);font-size:11px;text-transform:uppercase;letter-spacing:.5px}.spec b{font-size:13.5px;font-weight:600}
.flt{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}.flt input{max-width:320px}.flt select{width:auto}

/* modal */
.ov{position:fixed;inset:0;background:rgba(26,12,48,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.mb{background:var(--p);border-radius:14px;width:100%;max-width:1000px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 28px;border-bottom:1px solid var(--b)}
.mg{display:grid;grid-template-columns:3fr 2fr;flex:1;min-height:0}
@media(max-width:820px){.mg{grid-template-columns:1fr;overflow-y:auto}}
#mf,#mp{padding:28px;overflow-y:auto}#mp{background:var(--p2);border-left:1px solid var(--b)}
.mf2{display:flex;justify-content:flex-end;gap:10px;padding:16px 28px;border-top:1px solid var(--b)}
.st{display:flex;gap:10px;align-items:center;font-weight:700;margin:0 0 14px}.st b{width:24px;height:24px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:12.5px}
#mf .st:not(:first-child){margin-top:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip2{border:1px solid var(--bs);background:#fff;border-radius:8px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--t);transition:border-color .15s,background .15s}.chip2:hover{border-color:var(--g)}.chip2.on{border-color:var(--g);background:var(--gl);color:var(--g)}
.row,.row3{display:grid;gap:14px;grid-template-columns:1fr 1fr;margin-bottom:14px}.row3{grid-template-columns:1.4fr 1fr 1fr}
label{display:block;font-size:13px;font-weight:600;color:var(--m)}label input,label select{margin-top:6px;font-weight:400}
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rc{text-align:left;border:1px solid var(--b);background:#fff;border-radius:10px;padding:14px;position:relative;transition:border-color .15s}
.rc:hover{border-color:var(--g2)}.rc .e{font-size:22px}.rc b{display:block}.rc small{color:var(--m);font-size:12px;display:block}
.rc .pr{color:var(--g);font-weight:600;margin-top:4px}
.rc.on{border-color:var(--g);background:var(--gl)}.rc.bad{border-color:var(--red);background:var(--redl)}.rc.free{border-color:var(--grn);background:var(--grnl)}
.rc .ck{position:absolute;top:10px;right:10px;width:20px;height:20px;border-radius:50%;background:var(--g);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center}.rc.bad .ck{background:var(--red)}.rc.free .ck{background:var(--grn)}
.idle{border:1px dashed var(--bs);border-radius:10px;padding:28px;text-align:center}.idle b{display:block;font-size:15px}.idle p{font-size:13px;color:var(--m);margin-top:4px}
.box{border-radius:10px;padding:16px;margin-bottom:14px;border:1px solid}.box p{font-size:13.5px;margin-top:4px}
.box.g{background:var(--grnl);border-color:#bcd9b8;color:#3f6a45}.box.r{background:var(--redl);border-color:#e8bdb7;color:var(--red)}
.sum{border:1px solid var(--b);background:#fff;border-radius:10px;padding:16px}.sum p{margin:6px 0;color:var(--t)}.sum div{margin-top:10px}
.rr{border:1px solid var(--b);border-radius:10px;padding:12px 14px;margin-bottom:10px;background:#fff}.rr.bad{border-color:#e8bdb7;background:var(--redl)}
.rr>div:first-child{display:flex;justify-content:space-between;gap:8px}.rt{color:var(--red);font-size:13px;font-weight:600}.gt{color:#3f6a45;font-size:13px;font-weight:600}
.ex{background:rgba(255,255,255,.7);border-radius:6px;padding:8px 10px;margin-top:8px;font-size:13px;color:var(--m)}.ex b{color:var(--t)}
#mp h4{margin:20px 0 10px;font-size:15px}
.alt{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;border:1px solid #e8c46c;background:var(--ochl);border-radius:10px;padding:12px 14px;margin-bottom:10px;transition:border-color .15s}
.alt:hover{border-color:var(--ochre)}.alt small{color:var(--m)}.alt em{font-style:normal;color:var(--g);font-weight:600;font-size:13px;white-space:nowrap}

/* toasts */
#toasts{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;display:flex;flex-direction:column;gap:10px;width:350px;max-width:calc(100vw - 40px)}
.toast{background:#fff;border:1px solid var(--b);border-left:4px solid;border-radius:8px;padding:12px 16px;box-shadow:0 6px 20px -8px rgba(26,12,48,.25)}
.toast.ok{border-left-color:var(--grn)}.toast.err{border-left-color:var(--red)}.toast.info{border-left-color:var(--g)}
.toast b{display:block}.toast small{color:var(--m);font-size:13px}

/* analytics */
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--m);font-weight:500}.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.bars{display:flex;align-items:flex-end;gap:8px;height:200px;margin-top:20px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:12px;color:var(--m);font-weight:500}
.bars i{display:block;width:100%;border-radius:4px 4px 0 0;background:var(--g)}.bars i.pk{background:var(--clay)}
.viz-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;margin-bottom:28px}
.viz-sub{color:var(--m);font-size:13px;margin-top:4px}
.donut-wrap{display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-top:20px}
.donut{width:156px;height:156px;flex-shrink:0;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-center{position:absolute;inset:0;display:grid;align-content:center;text-align:center}
.donut-center strong{font-size:30px;letter-spacing:-1px}.donut-center small{color:var(--m);font-size:12px}
.dl{display:grid;gap:14px;flex:1;min-width:150px}.dl div{display:flex;align-items:center;gap:9px;color:var(--m);font-size:13.5px;font-weight:500}.dl b{margin-left:auto;color:var(--t)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.area{fill:none;stroke:var(--g);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.areaf{fill:url(#af)}
.pt{fill:#fff;stroke:var(--g);stroke-width:2}
.cl{fill:var(--m);font-size:11px;font-weight:500}.gl{stroke:#e8dfd3;stroke-dasharray:3 5}
.rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--b)}.rank:last-child{border:0}
.rank .no{width:28px;height:28px;border-radius:50%;background:var(--gl);color:var(--g);display:grid;place-items:center;font-weight:700}
@media(max-width:850px){.viz-grid{grid-template-columns:1fr}}


/* typography */
.top h1,h2,.mh h3,.mh h2{font-family:var(--serif);font-weight:600;letter-spacing:-.01em}
.top h1{font-size:24px}h2{font-size:19px}
.stat b,.donut-center strong{font-family:var(--serif);font-weight:600;letter-spacing:-.02em}
.stat b{font-size:36px}
.day h4{font-family:var(--serif);font-size:15px;font-weight:600}
.hd b{font-family:var(--serif);font-size:15px;font-weight:600}
.rank .no{font-family:var(--serif)}
th{font-family:'DM Sans',sans-serif;letter-spacing:.8px}
.card{box-shadow:0 1px 2px rgba(31,22,51,.04),0 8px 24px -16px rgba(60,30,90,.18)}
.top{background:linear-gradient(90deg,#fff,#fffaf4)}
.btn.gold{background:linear-gradient(135deg,#5e4380,#9a6fb5);box-shadow:0 6px 14px -8px rgba(94,67,128,.7)}
.btn.gold:hover{background:linear-gradient(135deg,#4a336a,#a83be0)}
.day.today,.day:has(h4.td){border-color:var(--clay);background:#fff8f4}


/* ===== multicolour layer ===== */
:root{--k1:#5e4380;--k2:#c97b8c;--k3:#d9a273;--k4:#7fa8b8;--k5:#6fb800;--k6:#d4b36a}
body{background:linear-gradient(180deg,#f7f2eb,#f3ede4)}
.top{border-bottom:3px solid transparent;border-image:linear-gradient(90deg,#5e4380,#c97b8c,#d9a273,#d4b36a,#e6d3a3,#7fa8b8) 1}
nav a[href="#dash"]{--c:#e6d3a3}nav a[href="#cal"]{--c:#7fa8b8}nav a[href="#res"]{--c:#d9a273}
nav a[href="#rsv"]{--c:#ff5fa2}nav a[href="#conf"]{--c:#d4b36a}nav a[href="#ana"]{--c:#b49cff}
nav a::before{content:'';width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:12px;box-shadow:0 0 10px var(--c);flex-shrink:0}
nav a.on{background:color-mix(in srgb,var(--c) 18%,transparent);box-shadow:inset 3px 0 0 var(--c)}
nav a:hover{background:color-mix(in srgb,var(--c) 10%,transparent)}
.logo{background:linear-gradient(90deg,rgba(230,211,163,.12),transparent)}
.grid4>.card,.cg>.card{border-top:4px solid var(--k,#5e4380)}
:is(.grid4,.cg)>.card:nth-child(6n+1){--k:var(--k1)}:is(.grid4,.cg)>.card:nth-child(6n+2){--k:var(--k2)}
:is(.grid4,.cg)>.card:nth-child(6n+3){--k:var(--k3)}:is(.grid4,.cg)>.card:nth-child(6n+4){--k:var(--k4)}
:is(.grid4,.cg)>.card:nth-child(6n+5){--k:var(--k5)}:is(.grid4,.cg)>.card:nth-child(6n){--k:#e0a800}
.stat b{color:var(--k,var(--t))}
.cal .day{border-top:3px solid var(--k)}
.cal .day:nth-child(7n+1){--k:#c97b8c}.cal .day:nth-child(7n+2){--k:#d9a273}.cal .day:nth-child(7n+3){--k:#d4b36a}
.cal .day:nth-child(7n+4){--k:#8fae8b}.cal .day:nth-child(7n+5){--k:#7fa8b8}.cal .day:nth-child(7n+6){--k:#5e4380}.cal .day:nth-child(7n){--k:#9a6fb5}
.bars div:nth-child(5n+1) i{background:linear-gradient(#a58bff,#5e4380)}.bars div:nth-child(5n+2) i{background:linear-gradient(#ff8fb6,#c97b8c)}
.bars div:nth-child(5n+3) i{background:linear-gradient(#ffc27a,#d9a273)}.bars div:nth-child(5n+4) i{background:linear-gradient(#7fe6f7,#7fa8b8)}
.bars div:nth-child(5n) i{background:linear-gradient(#d4ff8a,#8fae8b)}.bars div i.pk{background:linear-gradient(#ffb347,#c9775a)!important}
.side-foot{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.sfr.demo{color:var(--neon);text-decoration:none;font-weight:700}
/* splash gate */
.sp-gate{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:14px;z-index:2}
#splash:not(.wait) .sp-gate{display:none}
#splash.wait .sp-in,#splash.wait .sp-in *{animation-play-state:paused!important}
#splash.wait .sp-skip{display:none}
.sp-enter{background:var(--neon);color:#2a1f3d;font-weight:700;font-size:17px;border-radius:99px;padding:15px 36px;animation:neonPulse 1.6s infinite}
@keyframes neonPulse{0%{box-shadow:0 0 0 0 rgba(230,211,163,.55),0 12px 34px -10px rgba(230,211,163,.8)}70%,100%{box-shadow:0 0 0 24px rgba(230,211,163,0),0 12px 34px -10px rgba(230,211,163,.8)}}
.sp-gate p{color:#bfeaff;font-size:13px;margin:0}
/* demo walkthrough */
@keyframes bob{to{transform:translateY(-8px)}}
@keyframes dmType{to{width:100%}}@keyframes blink{50%{border-color:transparent}}
@keyframes dmSel{to{background:#efe8f4;border-color:#5e4380;color:#4a336a}}
@keyframes dmPulse{50%{transform:scale(1.06);box-shadow:0 0 0 9px rgba(94,67,128,.18)}}
#demo{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;color:#fff;background:radial-gradient(ellipse at 15% 10%,#3b1d8f 0%,transparent 55%),radial-gradient(ellipse at 92% 100%,#c2185b 0%,transparent 50%),#120a3a;animation:fadeIn .4s}
#demo[hidden]{display:none}#demo.hide{opacity:0;pointer-events:none;transition:opacity .4s}
.dm-top{display:flex;align-items:center;gap:14px;padding:16px 24px;flex-wrap:wrap}
.dm-top b{font-family:var(--serif);letter-spacing:4px;font-size:22px}.dm-top .sp{margin-left:auto}.dm-top span.t{color:#cfc4ff;font-size:13px}
.dm-btn{border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:8px 16px;font-weight:600;font-size:13px;color:#fff;background:rgba(255,255,255,.08);transition:background .15s}
.dm-btn:hover{background:rgba(255,255,255,.2)}.dm-btn:disabled{opacity:.35;cursor:not-allowed}
.dm-btn.neon{background:var(--neon);color:#2a1f3d;border-color:var(--neon)}.dm-btn.neon:hover{background:#c9ff6a}
.dm-main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1.15fr;gap:44px;align-items:center;padding:0 5vw;max-width:1220px;width:100%;margin:0 auto;animation:fadeIn .5s}
@media(max-width:820px){.dm-main{grid-template-columns:1fr;gap:18px;overflow-y:auto;align-content:start;padding-top:8px}}
.dm-txt small{color:var(--neon);font-weight:700;font-size:14px}
.dm-txt h2{font-family:var(--serif);font-size:clamp(28px,4.4vw,50px);line-height:1.08;margin:10px 0 16px;font-weight:600;color:#fff}
.dm-txt p{font-size:clamp(15px,1.7vw,18px);color:#e6defd;line-height:1.65;max-width:44ch}
.dm-stage{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:22px;padding:22px;min-height:310px;display:grid;align-content:center;color:#2b2430;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.dm-foot{display:flex;gap:10px;align-items:center;justify-content:center;padding:18px 24px calc(18px + env(safe-area-inset-bottom,0px))}
.seg{flex:1;max-width:90px;height:20px;background:none;display:flex;align-items:center}
.seg:before{content:'';position:absolute}.seg{position:relative}
.seg i{display:block;width:100%;height:5px;border-radius:9px;background:rgba(255,255,255,.22);position:relative;overflow:hidden}
.seg i:after{content:'';position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--neon),#ff5fa2)}
.seg.done i:after{width:100%}.seg.cur i:after{animation:load var(--dur) linear forwards}
.dm-pills{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;align-content:center}
.dm-pills span{background:#fff;border-radius:99px;padding:12px 20px;font-weight:700;border-left:9px solid var(--c);animation:pop .5s calc(var(--i)*.18s + .2s) both,bob 2.6s calc(var(--i)*.25s + 1.4s) ease-in-out infinite alternate}
.dm-heat{display:grid;grid-template-columns:54px repeat(10,1fr);gap:5px;align-items:center;font-size:11px;font-weight:700}
.dm-heat i{display:block;height:30px;border-radius:6px;animation:pop .4s calc(var(--d)*1s) both}.dm-heat i.cf{outline:2px solid #e11d48;outline-offset:1px}
.dm-note{font-size:13px;color:#7b7080;margin-top:12px;font-weight:600}
.mk{background:#fff;border-radius:14px;padding:18px}.mk label{font-size:12px;color:#7b7080}
.dm-in{border:1px solid #ddd2c5;border-radius:8px;padding:10px 12px;margin:6px 0 14px;font-weight:600}
.dm-type{display:block;overflow:hidden;white-space:nowrap;width:0;border-right:2px solid #5e4380;animation:dmType 1.8s steps(24) .3s forwards,blink .7s infinite}
.dm-chs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.dm-ch{border:1px solid #ddd2c5;border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;animation:dmSel .4s calc(2.3s + var(--i)*.6s) forwards}
.dm-go{display:inline-block;background:linear-gradient(135deg,#5e4380,#c97b8c);color:#fff;border-radius:8px;padding:10px 18px;font-weight:700;animation:dmPulse 1.2s 4.4s infinite}
.dm-box{border-radius:10px;padding:14px 16px;margin-bottom:10px;border:1px solid;animation:fadeUp .5s calc(var(--d)*1s) both}
.dm-box.r{background:#f9e7ea;border-color:#c97b8c;color:#9c3a52}.dm-box.g{background:#e9f2e6;border-color:#9cc79a;color:#3f6a45}
.dm-box.y{background:#f8efd9;border-color:#d4b36a;color:#7a5a12;display:flex;justify-content:space-between;gap:10px}
.dm-box p{margin:3px 0 0;font-size:13px}
.dm-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dm-cal>div{background:#fff;border-radius:8px;border-top:3px solid var(--k);padding:8px 5px;min-height:150px}
.dm-cal b{font-family:var(--serif);font-size:13px;display:block;margin-bottom:6px}
.dm-chip{display:block;font-size:10px;font-weight:700;padding:3px 5px;border-radius:4px;margin-bottom:4px;background:var(--cb);color:var(--ct);border:1px solid var(--ct);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;animation:pop .4s calc(.4s + var(--i)*.35s) both}
.dm-chip.dash{border-style:dashed}
.dm-an{display:flex;align-items:flex-end;gap:22px}
.dm-bars{flex:1;display:flex;align-items:flex-end;gap:8px;height:170px}
.dm-bars i{flex:1;height:var(--h);background:var(--c);border-radius:5px 5px 0 0;transform-origin:bottom;animation:rise .8s calc(var(--i)*.1s + .2s) cubic-bezier(.2,.8,.2,1) both}
.dm-donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;background:conic-gradient(#5e4380 0 58%,#d4b36a 58% 82%,#c97b8c 82% 100%);-webkit-mask:radial-gradient(circle,transparent 46%,#000 47%);mask:radial-gradient(circle,transparent 46%,#000 47%);animation:pop .6s .9s both}


/* smart suggestions */
.sm{background:#fff;border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:12px}
.sm-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.sm .btn{padding:6px 12px;font-size:13px}
.alt.sm-slot{border-color:#c6b4dc;background:#efe8f4;margin-top:8px}.alt.sm-slot:hover{border-color:#5e4380}
.chip2.sm-add{display:flex;width:100%;justify-content:space-between;align-items:center;gap:10px;text-align:left;margin-top:8px}
.sm-c{border-radius:8px;padding:9px 12px;margin-top:8px;font-size:13px;border:1px solid;font-weight:500}
.sm-c.ok{background:#e9f2e6;border-color:#bcd9b8;color:#3f6a45}.sm-c.bad{background:#f9e7ea;border-color:#e5aab5;color:#9c3a52}.sm-c.warn{background:#f8efd9;border-color:#d4b36a;color:#7a5a12}
.sm-link{display:block;margin-top:6px;padding:0;color:#4a336a;font-weight:700;text-decoration:underline;text-underline-offset:3px}


/* login + greeting */
#auth,#welcome{position:fixed;inset:0;display:grid;place-items:center;padding:16px;overflow-y:auto}
#auth{z-index:170;background:radial-gradient(ellipse at 15% 10%,#3b1d8f 0%,transparent 55%),radial-gradient(ellipse at 92% 100%,#c2185b 0%,transparent 50%),#120a3a;animation:fadeIn .4s}
#welcome{z-index:175;color:#fff;text-align:center;animation:fadeIn .5s;cursor:pointer;transition:opacity .5s}
#auth[hidden],#welcome[hidden]{display:none}#welcome.hide,#auth.hide{opacity:0;pointer-events:none;transition:opacity .45s}
.au-card{width:100%;max-width:430px;background:#fff;border-radius:22px;padding:30px 28px 24px;color:var(--t);box-shadow:0 40px 80px -30px rgba(0,0,0,.65);position:relative;overflow:hidden;animation:popm .45s cubic-bezier(.2,.9,.3,1.1)}
.au-card:before{content:'';position:absolute;left:0;right:0;top:0;height:5px;background:linear-gradient(90deg,#5e4380,#c97b8c,#d9a273,#d4b36a,#e6d3a3,#7fa8b8)}
.au-brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.au-brand b{font-family:var(--serif);font-size:24px;letter-spacing:4px}
.au-card h2{font-family:var(--serif);font-size:28px;font-weight:600;margin-bottom:4px}
.au-sub{color:var(--m);font-size:13.5px;margin-bottom:18px}
.au-tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1edf8;border-radius:10px;padding:4px;margin-bottom:18px}
.au-tabs button{padding:9px;border-radius:8px;font-weight:700;color:var(--m);transition:background .15s,color .15s}
.au-tabs button.on{background:#fff;color:#4a336a;box-shadow:0 2px 8px -3px rgba(60,30,90,.3)}
.au-card label{margin-bottom:14px}
.au-ph{display:flex;gap:8px;margin-top:6px}.au-ph span{display:grid;place-items:center;padding:0 12px;border:1px solid var(--bs);border-radius:8px;background:var(--p2);font-weight:600;color:var(--m)}
.au-ph input{margin-top:0}
.au-or{display:flex;align-items:center;gap:10px;color:var(--m);font-size:12px;margin:-2px 0 12px}.au-or:before,.au-or:after{content:'';flex:1;height:1px;background:var(--b)}
.au-err{min-height:20px;color:var(--red);font-size:13px;font-weight:600;margin-bottom:8px}.au-err:not(:empty){background:#f9e7ea;border:1px solid #e5aab5;border-radius:8px;padding:9px 12px}.au-err.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.au-card .btn.gold{width:100%;justify-content:center;padding:12px;font-size:15px}
.au-foot{margin-top:14px;text-align:center;font-size:12.5px;color:var(--m)}
.au-link{padding:0;color:#4a336a;font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13px}
.uchip{display:flex;align-items:center;gap:10px}
.uchip .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--serif);background:linear-gradient(135deg,#5e4380,#c97b8c)}
.uchip .un{line-height:1.25;font-weight:600;font-size:13.5px}.uchip .un small{display:block;color:var(--m);font-weight:500;font-size:12px}
.uchip .so{font-size:12.5px;font-weight:600;color:var(--m);text-decoration:underline;text-underline-offset:3px;padding:4px}
.uchip .so:hover{color:var(--red)}
@media(max-width:700px){.uchip .un{display:none}}
.wl-in{display:flex;flex-direction:column;align-items:center;padding:20px;max-width:90vw}
.wl-ic{width:96px;height:96px;margin-bottom:18px;animation:pop .7s .1s cubic-bezier(.2,1.3,.4,1) both;filter:drop-shadow(0 0 22px rgba(255,255,255,.45))}
.wl-g{font-family:var(--serif);font-size:clamp(26px,5vw,44px);font-weight:500;opacity:.95;animation:fadeUp .6s .3s both}
.wl-n{font-family:var(--serif);font-size:clamp(46px,11vw,110px);font-weight:700;line-height:1.05;margin:6px 0 14px;animation:fadeUp .7s .5s both;word-break:break-word}
.wl-s{font-size:clamp(14px,2vw,18px);color:#fff;opacity:.9;animation:fadeIn .6s 1s both;max-width:36ch}
.wl-go{margin-top:26px;font-size:13px;color:var(--neon);font-weight:700;animation:fadeIn .6s 1.4s both}
.wl.morning{background:linear-gradient(160deg,#ffb36b,#ff6fa5 55%,#7b4dff)}
.wl.afternoon{background:linear-gradient(160deg,#35c8f0,#5e4380 60%,#9a6fb5)}
.wl.evening{background:linear-gradient(160deg,#ff8a3d,#d6336c 45%,#3b1d8f)}
.wl.night{background:linear-gradient(160deg,#2a1f3d,#4a1f9e 60%,#14052f)}


/* assistant */
#toasts{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.as-btn{position:fixed;right:22px;bottom:calc(22px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;z-index:60;display:grid;place-items:center;background:linear-gradient(135deg,#5e4380,#c97b8c);box-shadow:0 12px 28px -8px rgba(94,67,128,.7);animation:asPulse 2.4s infinite;transition:transform .15s}
.as-btn:hover{transform:scale(1.07)}.as-btn[hidden],.as-panel[hidden]{display:none}
@keyframes asPulse{0%{box-shadow:0 12px 28px -8px rgba(94,67,128,.7),0 0 0 0 rgba(230,211,163,.55)}70%,100%{box-shadow:0 12px 28px -8px rgba(94,67,128,.7),0 0 0 16px rgba(230,211,163,0)}}
.as-panel{position:fixed;right:22px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:370px;height:520px;max-height:calc(100vh - 120px);z-index:61;background:#fff;border-radius:18px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 30px 70px -20px rgba(26,12,48,.55);border:1px solid var(--b);animation:popm .25s cubic-bezier(.2,.9,.3,1.1)}
body:has(#modal .ov) .as-btn,body:has(#modal .ov) .as-panel{display:none}
.as-h{display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,#2a1f3d,#5e4380 60%,#9a6fb5);color:#fff}
.as-h b{display:block;font-family:var(--serif);font-size:16px;font-weight:600}.as-h small{opacity:.85;font-size:12px}
.as-av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;flex-shrink:0}
.as-x{margin-left:auto;color:#fff;opacity:.85;font-size:15px;padding:4px 8px}.as-x:hover{opacity:1}
.as-log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:#faf8fd}
.as-m{max-width:90%;padding:10px 13px;border-radius:14px;font-size:13.5px;line-height:1.5;animation:fadeUp .25s both;word-wrap:break-word}
.as-bot{background:#fff;border:1px solid var(--b);border-left:3px solid #5e4380;align-self:flex-start;border-top-left-radius:4px}
.as-user{background:linear-gradient(135deg,#5e4380,#9a6fb5);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.as-cs{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.as-chip{border:1px solid #c6b4dc;background:#efe8f4;color:#4a336a;border-radius:99px;padding:5px 11px;font-size:12.5px;font-weight:600;text-align:left;transition:background .15s}
.as-chip:hover{background:#ddd3ff}
.as-typing{display:flex;gap:4px;padding:12px 14px}.as-typing i{width:7px;height:7px;border-radius:50%;background:#a58bff;animation:asDot 1s infinite}
.as-typing i:nth-child(2){animation-delay:.15s}.as-typing i:nth-child(3){animation-delay:.3s}
@keyframes asDot{50%{transform:translateY(-5px);opacity:.5}}
.as-in{display:flex;gap:8px;padding:12px;border-top:1px solid var(--b);background:#fff}
.as-in input{flex:1}.as-send{background:linear-gradient(135deg,#5e4380,#9a6fb5);color:#fff;border-radius:8px;padding:0 16px;font-weight:700}
@media(max-width:520px){.as-panel{left:10px;right:10px;width:auto;height:70vh}.as-btn{right:14px}}

/* ===== motion ===== */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}}
@keyframes fadeDown{from{opacity:0;transform:translateY(-10px)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes slideInL{from{opacity:0;transform:translateX(-24px)}}
@keyframes pop{from{opacity:0;transform:scale(.5)}}
@keyframes popm{from{opacity:0;transform:scale(.95) translateY(14px)}}
@keyframes sl{from{opacity:0;transform:translateX(36px)}}
@keyframes grow{from{width:0}}
@keyframes rise{from{transform:scaleY(0)}}
@keyframes ln{to{stroke-dashoffset:0}}
@keyframes draw{from{stroke-dasharray:0 282.74}}
@keyframes ripple{to{transform:scale(1);opacity:0}}
@keyframes load{to{width:100%}}
@keyframes strokeIn{to{stroke-dashoffset:0}}
@keyframes letter{to{opacity:1;transform:none}}
@keyframes dotIn{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}

/* opening */
#splash{position:fixed;inset:0;z-index:200;display:grid;place-items:center;background:radial-gradient(ellipse at 18% 12%,#0a8fe8 0%,transparent 55%),radial-gradient(ellipse at 88% 92%,#7c3aed 0%,transparent 52%),radial-gradient(ellipse at 55% 50%,rgba(34,211,238,.22),transparent 60%),linear-gradient(160deg,#071a4a,#030a24);cursor:pointer;transition:transform .85s cubic-bezier(.7,0,.2,1)}
#splash.out{transform:translateY(-100%);pointer-events:none}
.sp-in{display:flex;flex-direction:column;align-items:center;text-align:center;padding:20px}
.sp-mark{width:88px;height:88px;fill:none;stroke:#fff;stroke-linecap:round;stroke-linejoin:round;overflow:visible;filter:drop-shadow(0 0 18px rgba(34,211,238,.7))}
.sp-box{stroke-width:1.5;stroke-opacity:.55;stroke-dasharray:1;stroke-dashoffset:1;animation:strokeIn .9s .1s ease-out forwards}
.sp-a{stroke-width:3.6;stroke-dasharray:1;stroke-dashoffset:1;animation:strokeIn .8s .55s ease-out forwards}
.sp-dot{fill:#d4b36a;stroke:none;transform-box:fill-box;transform-origin:center;opacity:0;animation:dotIn .4s 1.25s cubic-bezier(.2,1.4,.4,1) forwards}
.sp-word{display:flex;gap:.14em;margin-top:30px;font-family:var(--serif);font-weight:600;font-size:clamp(44px,11vw,84px);letter-spacing:.12em;color:#fff;line-height:1}
.sp-word span{display:inline-block;opacity:0;transform:translateY(30px);animation:letter .6s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.9s + var(--i)*.09s)}
.sp-sub{margin-top:18px;color:#bfeaff;letter-spacing:.3em;font-size:12px;text-transform:uppercase;font-weight:500;opacity:0;animation:fadeIn .6s 1.7s forwards}
.sp-bar{width:180px;height:3px;background:rgba(255,255,255,.14);border-radius:9px;margin-top:30px;overflow:hidden}
.sp-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#7fa8b8,#8466a8,#ff7ac8);animation:load 2.3s .4s ease-out forwards}
.sp-skip{position:absolute;bottom:26px;font-size:11px;color:#b6dcf5;opacity:.7;margin:0}
/* ===== opening page (simple, one colour) ===== */
#splash{overflow:hidden;background:radial-gradient(ellipse at 50% 38%,#33264a 0%,#1d1630 55%,#120d1e 100%)}
#splash .sp-in{position:relative;z-index:1;width:100%}
.sp-kick{font-size:clamp(11px,1.4vw,13px);letter-spacing:.5em;text-transform:uppercase;font-weight:500;color:#cdbfa3;opacity:0;animation:fadeIn 1s .2s forwards;margin:0}
#splash .sp-mark{width:46px;height:46px;margin-bottom:26px;filter:none;opacity:.9}
#splash .sp-word{margin-top:10px;gap:.06em;font-weight:400;font-size:clamp(72px,20vw,290px);letter-spacing:.06em;line-height:1;color:#f6f1ea}
#splash .sp-word span{opacity:0;transform:translateY(.18em);filter:blur(10px);color:#f6f1ea;background:none;-webkit-text-fill-color:#f6f1ea;animation:letterSoft 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(.5s + var(--i)*.16s)}
@keyframes letterSoft{to{opacity:1;transform:none;filter:blur(0)}}
.sp-line{height:1px;width:min(380px,50vw);margin:clamp(16px,2.4vw,28px) auto 0;background:linear-gradient(90deg,transparent,#cdbfa3,transparent);transform:scaleX(0);animation:lineIn 1.2s 1.5s ease-out forwards}
@keyframes lineIn{to{transform:scaleX(1)}}
#splash .sp-sub{margin-top:22px;font-size:clamp(11px,1.5vw,14px);letter-spacing:.38em;color:#cdbfa3;animation-delay:2s}
.sp-tag{margin-top:12px;max-width:44ch;color:#b9aecb;font-size:clamp(13px,1.5vw,16px);line-height:1.65;opacity:0;animation:fadeIn .9s 2.3s forwards}
.sp-go{margin-top:34px;display:inline-flex;align-items:center;gap:10px;border:1px solid #cdbfa3;color:#f6f1ea;background:transparent;font-weight:500;font-size:15px;letter-spacing:.08em;border-radius:99px;padding:13px 32px;opacity:0;animation:fadeIn .9s 2.7s forwards;transition:background .2s,color .2s}
.sp-go:hover{background:#e6d3a3;color:#2a1f3d}
.sp-go svg{width:16px;height:16px}
#splash.wait .sp-go{pointer-events:none}
#splash .sp-bar,#splash .sp-skip{display:none}
.sp-enter{animation:none;background:#e6d3a3;font-weight:600;font-size:15px;letter-spacing:.06em;padding:14px 34px}
.sp-gate p{color:#b9aecb}
@media(prefers-reduced-motion:reduce){#splash .sp-word span{animation:none;opacity:1;transform:none;filter:none}}

/* ===== aesthetic layer ===== */
html{font-synthesis:none;-webkit-font-smoothing:antialiased}
body{font-family:'DM Sans',system-ui,sans-serif;font-size:14.5px;letter-spacing:.005em;background:#f6f1ea}
h1,h2,h3,h4,.stat b,.donut-center strong,.day h4,.hd b,.rank .no,.au-card h2,.dm-txt h2,.wl-g,.wl-n{font-weight:400!important}
.top h1{font-size:32px;line-height:1.1;letter-spacing:-.01em}
h2{font-size:23px;letter-spacing:-.005em}
.stat b{font-size:46px;line-height:1.05;color:var(--t)}
.stat small{letter-spacing:.02em}
.stat small:first-child{text-transform:uppercase;font-size:11px;letter-spacing:.14em;font-weight:600}
.mu,small{letter-spacing:.01em}
th{font-size:11px;letter-spacing:.14em;font-weight:600}
.wm b{font-size:30px;letter-spacing:.3em;font-weight:400}

function findBest(){const m=S.m;
 if(!m.sel.length||tm(m.e)<=tm(m.s)){toast('err','Cannot search yet','Select at least one resource and a valid time range first.');return}
 const dur=tm(m.e)-tm(m.s),setup=Math.max(...m.sel.map(id=>rn(id).setup)),want=tm(m.s),now=new Date(),nm=now.getHours()*60+now.getMinutes(),c=[];

let started=false;
function chime(){
 try{
  const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
  const ctx=new AC();if(ctx.resume)ctx.resume();
  const T=ctx.currentTime+.05;
  const master=ctx.createGain();master.gain.value=.8;
  const comp=ctx.createDynamicsCompressor();master.connect(comp);comp.connect(ctx.destination);
  const len=Math.floor(ctx.sampleRate*2.8),ir=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
  const conv=ctx.createConvolver();conv.buffer=ir;const wet=ctx.createGain();wet.gain.value=.55;conv.connect(wet);wet.connect(master);
  const dry=ctx.createGain();dry.gain.value=.8;dry.connect(master);
  const send=n=>{n.connect(dry);n.connect(conv)};
  // 1) rising whoosh while the logo draws
  const nb=ctx.createBuffer(1,Math.floor(ctx.sampleRate*1.4),ctx.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const ns=ctx.createBufferSource();ns.buffer=nb;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=2.2;
  bp.frequency.setValueAtTime(250,T);bp.frequency.exponentialRampToValueAtTime(5200,T+1);
  const ng=ctx.createGain();ng.gain.setValueAtTime(.0001,T);ng.gain.linearRampToValueAtTime(.32,T+.95);ng.gain.exponentialRampToValueAtTime(.0001,T+1.3);
  ns.connect(bp);bp.connect(ng);send(ng);ns.start(T);ns.stop(T+1.4);
  // 2) deep impact as the letters land
  const sub=ctx.createOscillator(),sg=ctx.createGain();sub.type='sine';
  sub.frequency.setValueAtTime(110,T+1);sub.frequency.exponentialRampToValueAtTime(42,T+1.5);
  sg.gain.setValueAtTime(.0001,T+1);sg.gain.linearRampToValueAtTime(.7,T+1.02);sg.gain.exponentialRampToValueAtTime(.0001,T+2.1);
  sub.connect(sg);sg.connect(master);sub.start(T+1);sub.stop(T+2.2);
  // 3) warm pad swell
  [130.8,196].forEach(f=>[-6,6].forEach(dt=>{const o=ctx.createOscillator(),g=ctx.createGain(),lp=ctx.createBiquadFilter();
   o.type='sawtooth';o.frequency.value=f*2;o.detune.value=dt;lp.type='lowpass';
   lp.frequency.setValueAtTime(300,T+.6);lp.frequency.exponentialRampToValueAtTime(2200,T+1.4);
   g.gain.setValueAtTime(.0001,T+.6);g.gain.linearRampToValueAtTime(.05,T+1.1);g.gain.exponentialRampToValueAtTime(.0001,T+3.6);
   o.connect(lp);lp.connect(g);send(g);o.start(T+.6);o.stop(T+3.7)}));
  // 4) bell chord (Cmaj9) + sparkle arpeggio
  const bell=(f,t,d,v)=>[[1,v],[2.01,v*.35],[3.99,v*.12]].forEach(([m,vv])=>{const o=ctx.createOscillator(),g=ctx.createGain();
   o.type='sine';o.frequency.value=f*m;g.gain.setValueAtTime(.0001,T+t);g.gain.linearRampToValueAtTime(vv,T+t+.012);
   g.gain.exponentialRampToValueAtTime(.0001,T+t+d/Math.pow(m,.3));o.connect(g);send(g);o.start(T+t);o.stop(T+t+d+.1)});
  [261.63,329.63,392,493.88,587.33].forEach(f=>bell(f,1,3,.15));
  [1046.5,1318.5,1568,1975.5,2349.3,3135.9].forEach((f,i)=>bell(f,1.25+i*.11,1.8,.08));
  setTimeout(()=>{try{ctx.close()}catch(e){}},7000);
 }catch(e){}
}

function asTime(t){
 const tp=(h,m,ap)=>{h=+h;m=+(m||0);if(ap==='pm'&&h<12)h+=12;if(ap==='am'&&h===12)h=0;return h*60+m};
 let m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?\s*(?:to|-|–|till|until)\s*(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
 if(m&&+m[1]<=24&&+m[4]<=24){
  let a=tp(m[1],m[2],m[3]||m[6]),b=tp(m[4],m[5],m[6]||m[3]);
  if(!m[3]&&!m[6]){if(+m[1]<8)a+=720;if(b<=a&&b+720<=1440)b+=720}
  if(b>a)return{s:Math.max(480,a),e:Math.min(1380,b),explicit:1}}
 m=t.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b/)||t.match(/\b(?:at|from|around|@)\s*(\d{1,2})(?::(\d{2}))?\b/)||t.match(/\b(\d{1,2}):(\d{2})\b/);
 if(m){let st=tp(m[1],m[2],m[3]);if(!m[3]&&st<480)st+=720;const e=Math.min(1380,st+(asHours(t)||3)*60);if(e>st&&st<1380)return{s:Math.max(480,st),e,explicit:1}}
 const w=[['morning',540,720],['afternoon',780,1020],['evening',1020,1260],['night',1140,1380]].find(x=>t.includes(x[0]));
 if(w)return{s:w[1],e:w[2],explicit:1};
 return{explicit:0}}
function asMount(){if($('#as-btn'))return;
 const star='<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 6.3L21 10l-6.8 1.7L12 18l-2.2-6.3L3 10l6.8-1.7z" fill="#fff"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9z" fill="#e6d3a3"/></svg>';
 document.body.insertAdjacentHTML('beforeend',`<button id="as-btn" class="as-btn" hidden onclick="asToggle()" aria-label="Open ARIXA assistant">${star}</button>
<div id="as-panel" class="as-panel" hidden role="dialog" aria-label="ARIXA assistant"><div class="as-h"><span class="as-av">${star}</span><div><b>ARIXA Assistant</b><small>Answers from your live bookings</small></div><button class="as-x" onclick="asToggle(false)" aria-label="Close">✕</button></div>
<div id="as-log" class="as-log" aria-live="polite"></div>
<div class="as-in"><input id="as-input" placeholder="Ask about slots, costs, conflicts…" autocomplete="off" onkeydown="if(event.key==='Enter'){event.preventDefault();asSend()}"><button class="as-send" onclick="asSend()">Send</button></div></div>`);
 document.addEventListener('click',e=>{const c=e.target.closest&&e.target.closest('.as-chip');if(!c)return;if(c.dataset.q)asAsk(c.dataset.q);else if(c.dataset.act)asAct(c.dataset.act,c)});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&asOpen)asToggle(false)})}
const asShow=()=>{asMount();$('#as-btn').hidden=false};
function asHide(){if(!$('#as-btn'))return;asOpen=false;$('#as-btn').hidden=true;$('#as-panel').hidden=true;$('#as-log').innerHTML='';asLast=null}
const asChips=a=>`<div class="as-cs">${a.map(c=>`<button class="as-chip" ${c[1]}>${c[0]}</button>`).join('')}</div>`;
const asQ=q=>`data-q="${esc(q)}"`;
const asStart=()=>asChips([["What's on today?",asQ("What's on today?")],['Is sound free tomorrow 5 pm to 9 pm?',asQ('Is sound free tomorrow 5 pm to 9 pm?')],['Any conflicts?',asQ('Any conflicts?')],['Busiest resource',asQ('Busiest resource')],['Venue for 800 guests',asQ('Which venue fits 800 guests?')]]);
function asAdd(role,html){const l=$('#as-log');if(!l)return;const d=document.createElement('div');d.className='as-m as-'+role;d.innerHTML=html;l.appendChild(d);l.scrollTop=l.scrollHeight;return d}
function asToggle(force){asMount();asOpen=force!==undefined?force:!asOpen;$('#as-panel').hidden=!asOpen;
 if(asOpen){if(!$('#as-log').children.length)asAdd('bot',`${greet()}${USER?', '+esc(firstName()):''}! I am the ARIXA assistant. I answer from the bookings on this site. Try one of these:`+asStart());setTimeout(()=>{const i=$('#as-input');i&&i.focus()},60)}}
function asAsk(q){asToggle(true);const i=$('#as-input');i.value=q;asSend()}
function asSend(){const i=$('#as-input'),raw=i.value.trim();if(!raw)return;i.value='';asAdd('user',esc(raw));
 const ty=asAdd('bot','<span class="as-typing"><i></i><i></i><i></i></span>');ty.classList.add('as-typing-wrap');
 setTimeout(()=>{let r;try{r=asReply(raw)}catch(e){r='Sorry, I could not work that out. Try asking about a resource, a date or a time.'}ty.innerHTML=r;$('#as-log').scrollTop=1e9},520)}
function asAct(a,el){
 if(a==='nav'){go(el.dataset.p);asToggle(false);return}
 if(a==='demo'){asToggle(false);showDemo();return}
 const l=asLast||{};
 if(a==='book'){asToggle(false);openM({date:l.date,s:l.s,e:l.e,sel:l.sel||[]});return}
 if(a==='alt'){const x=(l.alts||[])[+el.dataset.i];if(!x)return;asToggle(false);openM({date:x.date,s:x.s,e:x.e,sel:l.sel||[]})}}
function asAgenda(d){const l=res.filter(x=>x.date===d).sort((a,b)=>tm(a.s)-tm(b.s));
 if(!l.length)return `Nothing is booked on <b>${fd(d)}</b>. Every resource is free.`+asChips([['Open calendar','data-act="nav" data-p="cal"']]);
 let o=`<b>${fd(d)}</b>: ${l.length} reservation${l.length>1?'s':''}`;
 l.slice(0,6).forEach(x=>{o+=`<br>• ${x.s}–${x.e} · ${esc(x.ev)} · ${esc(x.venue)}${x.st==='p'?' (pending)':''}`});
 if(l.length>6)o+=`<br>…and ${l.length-6} more`;
 return o+asChips([['Open calendar','data-act="nav" data-p="cal"']])}
function asAvail(rs,d,tv){
 const names=rs.map(id=>rn(id).n).join(', ');
 if(d<D(0)||d>D(13))return 'I only have bookings for the next 14 days, so I cannot check '+fd(d)+'.';
 if(!tv.explicit){let o=`<b>${esc(names)}</b> on ${fd(d)}:`;
  rs.forEach(id=>{const bk=res.filter(x=>x.date===d&&x.rs.includes(id)).sort((a,b)=>tm(a.s)-tm(b.s));o+=`<br>• ${rn(id).n}: `+(bk.length?bk.map(x=>`${x.s}–${x.e} (${esc(x.ev)})`).join(', '):'free all day')});
  asLast={date:d,s:'18:00',e:'21:00',sel:rs};
  return o+'<br>Tell me a time, like "5 pm to 9 pm", and I will check that exact slot.'+asChips([['Reserve '+(rs.length>1?'these':'this'),'data-act="book"']])}
 const q={date:d,s:ft(tv.s),e:ft(tv.e),sel:rs},h=hits(q);asLast={date:d,s:q.s,e:q.e,sel:rs};
 if(!h.length)return `Yes. <b>${esc(names)}</b> ${rs.length>1?'are':'is'} free on ${fd(d)}, ${q.s}–${q.e}. Estimated cost: <b>${inr(costOf(rs,q.s,q.e))}</b>.`+asChips([['Reserve this slot','data-act="book"']]);
 const by={};h.forEach(x=>(by[x.rid]=by[x.rid]||[]).push(x.b));
 let o=`Not for the whole slot. On ${fd(d)}, ${q.s}–${q.e}:`;
 Object.keys(by).forEach(id=>{o+=`<br>• ${rn(id).n} is booked ${by[id].map(b=>`${b.s}–${b.e} (${esc(b.ev)})`).join(', ')}`});
 const fr=rs.filter(id=>!by[id]);if(fr.length)o+=`<br>• Free: ${fr.map(id=>rn(id).n).join(', ')}`;
 const al=alts({date:d,s:q.s,e:q.e,sel:rs});asLast.alts=al;
 o+=al.length?'<br>Free alternatives:':'<br>No slot in the next two weeks has all of them free. Try fewer resources.';
 return o+asChips(al.map((a,i)=>[`${fd(a.date)} ${a.s}–${a.e}`,`data-act="alt" data-i="${i}"`]))}
function asReply(raw){
 const t=raw.toLowerCase().replace(/[?!.,]+$/g,'').trim(),rs=asRes(t),d=asDate(t),tv=asTime(t);
 if(/^(hi+|hello|hey|namaste|good (morning|afternoon|evening))\b/.test(t))return `${greet()}${USER?', '+esc(firstName()):''}! I can check availability, list events, find conflicts, estimate costs or help you book.`+asStart();
 if(/\b(thanks|thank you|thx)\b/.test(t))return 'You are welcome! Ask me anything else about your bookings.';
 if(/\b(demo|walkthrough|tour|how does (it|this|arixa) work|how to use)\b/.test(t))return 'Happy to show you around.'+asChips([['Watch the walkthrough','data-act="demo"']]);
 if(/\b(help|what can you do|options)\b/.test(t))return 'I can:<br>• check if a resource is free at a time<br>• list what is happening on a day<br>• find conflicts and busiest resources<br>• estimate costs and suggest venues<br>• open the booking form for you'+asStart();
 if(/\b(conflict|clash|double[- ]?book)/.test(t)){const o=C.filter(c=>c.st==='open');
  if(!o.length)return 'No open conflicts right now. Everything is clear.';
  let r=`There ${o.length>1?'are':'is'} <b>${o.length} open conflict${o.length>1?'s':''}</b>:`;
  o.slice(0,3).forEach(c=>{r+=`<br>• ${rn(c.rid).n}: ${esc(c.inName)} vs ${esc(c.exName)}, ${fd(c.date)} ${c.s}–${c.e}`});
  if(o.length>3)r+=`<br>…and ${o.length-3} more`;
  return r+asChips([['Open conflicts','data-act="nav" data-p="conf"']])}
 if(/\b(busiest|most used|most booked|popular|utili[sz]ation|analytics)\b/.test(t)){
  const l=R.map(r=>({r,h:hoursBooked(r.id)})).sort((a,b)=>b.h-a.h);
  return `Busiest over the next 14 days:<br>${l.slice(0,3).map((x,i)=>`${i+1}. <b>${x.r.n}</b>, ${x.h.toFixed(1)} hours booked`).join('<br>')}<br>Least used: ${l[l.length-1].r.n} (${l[l.length-1].h.toFixed(1)} h).`+asChips([['Open analytics','data-act="nav" data-p="ana"']])}
 const num=(t.match(/(\d[\d,]*)\s*(?:\+)?\s*(?:guests?|people|persons?|attendees?|audience|students|crowd|seats?)/)||t.match(/(?:for|hold|fit)\s*(\d[\d,]*)/)||[])[1];
 if(num&&/\b(venue|capacity|fit|fits|hold|holds|where|place|hall|ground|lawn)\b/.test(t)){const n=+num.replace(/,/g,'');
  const f=Object.entries(VCAP).filter(x=>x[1]>=n).sort((a,b)=>a[1]-b[1]);
  if(!f.length)return `No venue holds ${n.toLocaleString('en-IN')} people. The largest, Sports Ground, holds about ${VCAP['Sports Ground'].toLocaleString('en-IN')}.`;
  return `For <b>${n.toLocaleString('en-IN')}</b> guests, the closest fits are:<br>${f.slice(0,3).map((x,i)=>`${i+1}. <b>${x[0]}</b>, holds about ${x[1].toLocaleString('en-IN')}`).join('<br>')}`}
 if(/\b(cost|price|rate|charge|how much|estimate)\b/.test(t)){
  if(!rs.length)return 'Which resources? For example: "cost of stage and sound for 4 hours".'+asChips([['Cost of stage + sound for 4 hours',asQ('cost of stage and sound for 4 hours')]]);
  const hh=tv.explicit?(tv.e-tv.s)/60:(asHours(t)||1);
  let o=`For <b>${hh} hour${hh===1?'':'s'}</b>:`;rs.forEach(id=>{o+=`<br>• ${rn(id).n}: ${inr(rn(id).rate)}/hr = ${inr(rn(id).rate*hh)}`});
  o+=`<br><b>Total ${inr(rs.reduce((a,id)=>a+rn(id).rate*hh,0))}</b>`;
  asLast={date:d||D(1),s:'18:00',e:ft(Math.min(1380,1080+hh*60)),sel:rs};
  return o+asChips([['Reserve these','data-act="book"']])}
 if(/\b(book|reserve|reservation|schedule an?|set up|arrange)\b/.test(t)&&!rs.length){asLast={date:d||undefined,s:tv.explicit?ft(tv.s):undefined,e:tv.explicit?ft(tv.e):undefined,sel:[]};
  return 'Sure. I will open the booking form.'+asChips([['Open booking form','data-act="book"']])}
 if(rs.length)return asAvail(rs,d||D(0),tv);
 if(/\b(next|upcoming)\b/.test(t)){const now=new Date(),nm=now.getHours()*60+now.getMinutes(),td=iso(now);
  const n=res.filter(x=>x.date>td||(x.date===td&&tm(x.s)>=nm)).sort((a,b)=>a.date.localeCompare(b.date)||tm(a.s)-tm(b.s))[0];
  return n?`Next up: <b>${esc(n.ev)}</b>, ${fd(n.date)} ${n.s}–${n.e} at ${esc(n.venue)} (${esc(n.org)}).`:'There are no upcoming reservations.'}
 if(d||/\b(today|tomorrow|happening|events?|what'?s on|whats on|schedule|calendar|bookings?|reservations?)\b/.test(t))return asAgenda(d||D(0));
 return 'I am not sure about that one. I can check availability, list events for a day, find conflicts, estimate costs or suggest a venue.'+asStart()}

function endSplash(){if(ready)return;ready=true;try{sessionStorage.setItem('arixa_splash','1')}catch(e){}const sp=$('#splash');if(sp){sp.classList.add('out');setTimeout(()=>sp.remove(),950)}render();afterSplash()}
(function(){if(matchMedia('(prefers-reduced-motion: reduce)').matches){const sp=$('#splash');if(sp)sp.remove();endSplash()}})();
document.addEventListener('pointerdown',e=>{const t=e.target.closest&&e.target.closest('.btn,nav a,.chip2,.alt,.cell,.rc,.stat');if(!t)return;const r=t.getBoundingClientRect(),z=Math.max(r.width,r.height)*2,d=document.createElement('span');d.className='rip';d.style.cssText=`width:${z}px;height:${z}px;left:${e.clientX-r.left-z/2}px;top:${e.clientY-r.top-z/2}px`;t.appendChild(d);setTimeout(()=>d.remove(),600)});
loadBackendResources();

</script>
